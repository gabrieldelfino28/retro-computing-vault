<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Erro 500</title>
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/json/site.webmanifest.json">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font-Awesome icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center error-container">

    <div class="col-md-6">

        <div class="card error-card shadow rounded">

            <div class="card-header error-header text-center">
                <!--🚨 - 1F6A8 -->
                <div th:replace="~{fragments/emoji :: fluent(emoji='1f6a8', size='48')}"></div>
                Erro Interno do Servidor (500)
            </div>

            <div class="card-body text-center">

                <!--😅 - 1F6A8 -->
                <h4 class="mb-3">Ops! Algo deu errado <i
                        th:replace="~{fragments/emoji :: fluent(emoji='1f605', size='32')}"></i></h4>

                <div class="alert alert-danger mt-3">
                    <span>
                    O servidor encontrou um erro inesperado.<br>
                    Tente novamente ou volte para a página inicial.
                    </span>
                    <span th:text="${mensagem}"></span>
                </div>

                <a href="/" class="btn btn-fatec mt-3">
                    <i class="fa-solid fa-reply"></i> Voltar para o início
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
