<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Erro 500</title>
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/images/site.webmanifest.json">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @keyframes contentFade {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        :root {
            --fatec-red: #c40000;
            --fatec-dark-red: #8a0000;
        }

        @keyframes floatingBg {
            0% {
                transform:
                        scale(1)
                        translateY(0);
            }

            50% {
                transform:
                        scale(1.05)
                        translateY(-15px);
            }

            100% {
                transform:
                        scale(1.1)
                        translateY(0);
            }
        }

        body {

            background: #f8f9fa;

            min-height: 100vh;

            display: flex;
            align-items: center;

            position: relative;
            overflow: hidden;
            animation: contentFade .35s ease-out;
        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background: url('/elements/01.svg') center center no-repeat;

            background-size: 1800px;

            opacity: .10;

            animation: floatingBg 11s ease-in-out infinite alternate;

            pointer-events: none;
        }

        .error-container {
            position: relative;
            z-index: 1;
        }

        .error-card {
            border: none;
            border-radius: 12px;
        }

        .error-header {
            background-color: var(--fatec-red);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .btn-fatec {
            background-color: var(--fatec-red);
            color: white;
            border: none;
        }

        .btn-fatec:hover {
            background-color: var(--fatec-dark-red);
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center error-container">

    <div class="col-md-6">

        <div class="card error-card shadow">

            <div class="card-header error-header text-center">
                🚨 Erro Interno do Servidor (500)
            </div>

            <div class="card-body text-center">

                <h4 class="mb-3">Ops! Algo deu errado 😅</h4>

                <p class="text-muted">
                    O servidor encontrou um erro inesperado.
                    Tente novamente ou volte para a página inicial.
                </p>

                <a href="/" class="btn btn-fatec mt-3">
                    ⬅ Voltar para o início
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
