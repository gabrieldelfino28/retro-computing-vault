<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title>Página não encontrada | Fatec Zona Leste</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<section class="error-main" layout:fragment="content">
    <div class="error-page justify-content-center align-items-center">

        <div class="error-code animated-card">
            404
        </div>

        <h1 class="error-title animated-card">Desculpe!</h1>

        <p class="animated-card">
            A página que você está tentando acessar
            não foi encontrada.
        </p>

        <form class="search-form error-search-form animated-card">
            <input type="search"
                   class="search-input"
                   placeholder="Buscar no acervo...">

            <button type="submit"
                    class="search-button">
                <i class="bi bi-search"></i>
            </button>
        </form>

        <div class="fatec-card animated-card">
            <img src="/images/404.jpg" class="fatec-card-img" alt="Not Found">
            <svg class="fatec-card-svg">
                <rect class="fatec-card-rect" x="0" y="0" width="100%" height="100%"/>
            </svg>
        </div>

        <!-- Estrutura do Modal de Aviso -->


    </div>
    <div id="redirect-modal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            <h3>Página Não Encontrada</h3>
            <p>Gostaria de voltar para a página principal do Museu do Hardware?</p>
            <div class="modal-buttons">
                <a href="/" class="btn-modal btn-confirm">Sim, voltar</a>
                <button class="btn-modal btn-cancel" onclick="fecharModal()">Ficar aqui</button>
            </div>
        </div>
    </div>
    <script src="/js/404.js"></script>
</section>
</body>
</html>
