<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<body>
<section class="container mt-4 animated-card" layout:fragment="content">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show animated-card" style="animation-delay: 0.1s;" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="animated-card" style="animation-delay: 0.2s;">Computadores</h2>
        <a th:href="@{/computador/novo}"
           class="btn btn-danger">
            <i class="fa-solid fa-circle-plus"></i>
            Novo Computador
        </a>
    </div>
    <hr class="fatec-hr small animated-card" style="animation-delay: 0.1s;">

    <div class="card shadow-sm">
        <div class="card-body animated-card" style="animation-delay: 0.1s;">
            <div th:if="${itens == null or #lists.isEmpty(itens)}" class="alert alert-info mb-0">
                Nenhum computador cadastrado.
            </div>

            <div th:if="${itens != null and !#lists.isEmpty(itens)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Fabricante</th>
                        <th>Registrado Por</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="c : ${itens}">
                        <td th:text="${c.id}"></td>
                        <td th:text="${c.modelo}"></td>
                        <td th:text="${c.fabricante}"></td>
                        <td th:text="${c.registradoPor != null ? c.registradoPor.nome : '—'}"></td>

                        <td>
                            <div class="d-flex justify-content-end gap-2">

                                <a th:href="@{/computador/detalhe/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i th:replace="~{fragments/emoji :: fluent(emoji='1f50d', size='18')}"></i> Detalhar
                                </a>

                                <a th:href="@{/computador/editar/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-warning">
                                    <i th:replace="~{fragments/emoji :: fluent(emoji='270d-fe0f', size='18')}"></i> Editar
                                </a>

                                <button type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        th:data-id="${c.id}"
                                        th:data-modelo="${c.modelo}"
                                        onclick="abrirModalExclusao(this)">
                                    <i th:replace="~{fragments/emoji :: fluent(emoji='1f5d1-fe0f', size='18')}"></i> Excluir
                                </button>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- substitua o <div id="redirect-modal"> existente por isso: -->
    <div id="delete-modal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            <h3>Confirmar Exclusão</h3>
            <p id="delete-modal-message">Tem certeza que deseja excluir este registro?</p>
            <div class="modal-buttons">
                <button type="button" class="btn-modal btn-confirm" onclick="confirmarExclusao()">
                    Sim, excluir
                </button>
                <button class="btn-modal btn-cancel" onclick="fecharModalExclusao()">
                    Cancelar
                </button>
            </div>
        </div>
        <!-- Formulário oculto — evita GET para operações destrutivas -->
        <form id="delete-form" method="post" style="display:none;"></form>
    </div>

    <script src="/js/lista.js"></script>
</section>
</body>
</html>
