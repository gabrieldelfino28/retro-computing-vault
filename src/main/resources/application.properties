spring.application.name=retro-computing-vault

# ====== Database Configuration ====== #
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/computing_vault
spring.datasource.username=root
#spring.datasource.password=Gabe@root
spring.datasource.password=alunofatec
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====== JPA / Hibernate Configuration ====== #
spring.jpa.hibernate.ddl-auto=update
spring.session.jdbc.initialize-schema=always
spring.jpa.show-sql=true

# ====== # Thymeleaf settings # ====== #
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# ====== # Logging Settings # ====== #
logging.level.br.gov.sp.fateczl.museu=DEBUG
logging.file.name=logs/sistema-museu.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n